version: "3.9"

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: e_commerce
    # volumes:
    #   - ./data/db:/data/db

  app:
    build:
      context: .
    container_name: e_commerce_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: mongodb://mongodb:27017/e_commerce
    depends_on:
      - mongodb
    command: npm start

  # volumes:
  #   - .:/usr/src/app
